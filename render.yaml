services:
  - type: web
    name: hk-stock-sniper
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:server --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  - type: cron
    name: daily-scan
    runtime: python
    schedule: "30 8 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/daily_scan.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
